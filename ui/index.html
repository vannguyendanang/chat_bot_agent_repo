<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bank virtual assistant</title>
    <style>
        :root { --w: min(800px, 90vw); }

      /* Full-height column layout */
      .page {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Input row pinned at bottom */
      .input-row {
        width: var(--w);
        margin: 10px auto 16px;
        display: flex;
        gap: 5px;
      }

    .title{
    width: var(--w);
    margin: 16px auto 0;
    text-align: center;
    font-size: 28px;      /* make it large (try 28–32px) */
    line-height: 1.2;
    font-weight: 700;
    }

    /* Make the textarea fill the row and be taller */
    #input {
        flex: 1;
        height: 80px;           /* taller than rows=3 */
        font-size: 16px;
        resize: vertical;        /* let users drag taller if they want */
    }

    /* Nice sized button */
    #send {
        align-self: flex-start;  /* aligns with the top of the textarea */
        padding: 10px 16px;
        font-size: 16px;
        cursor: pointer;
    }

    /* Scrollable chat area */
    #response{
      width: var(--w);
      margin: 12px auto 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      scroll-behavior: smooth;
      padding: 12px;
    }

    /* Base bubble (assistant by default) */
    .msg{
      align-self: flex-start;    /* left */
      background: #fff;          /* white */
      color: #222;
      padding: 10px 14px;
      border: 1px solid #eee;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 80ch;
      line-height: 1.45;
      font-size: 17px;
    }
    /* User bubble only: right + gray */
    .msg.user{
      align-self: flex-end;      /* right */
      background: #eef3ff;       /* light gray */
      border-color: #e2e8ff;
    }


    .subtitle{
      margin-top: 7px;
      text-align: center;
      font-size: 1.0rem;
    }

    /* Column that holds the messages */
    #messages{
      display: flex;
      flex-direction: column;
      gap: 5px;                  /* spacing between bubbles */
      max-width: 800px;
      margin: 0 auto;
    }
    </style>

  </head>
  <body>
    
    <div class="page">
        <h1 class="title">ALLIANCE Bank Chat Bot Assistant</h1>
        <p class="subtitle">You are logged in under account number <strong id="acc"></strong>.
        <button id="logoutBtn">Logout</button>
        </p>
        <div id="response">
          <div id="messages"></div>
        </div>

        <div class="input-row">
        <textarea id="input" placeholder="Type your message"></textarea>
        <button id="send">Send</button>
        </div>
    </div>


    <script>
        //const sessionId = crypto.randomUUID();
        const chat = document.getElementById("response");
        const messages = document.getElementById("messages");
        const input = document.getElementById("input");
        const logoutBtn = document.getElementById("logoutBtn");
        const sendBtn = document.getElementById("send");
        const KEY = "bank_chat_session";

        // Read params from current page's URL
        const params = new URLSearchParams(window.location.search);
        const account = params.get("account");

        if (!account) {
            window.location.href = "/login.html";
        }

        // set value for element "acc"
        document.getElementById("acc").textContent = account
        
        // logout Button logic
        logoutBtn.onclick = () =>{
          // remove chat session id
           sessionStorage.removeItem(KEY);
          // remove greeting flag
          sessionStorage.removeItem("greeted");
          // redirect to React login page
          window.location.href = "/login.html";
        }

        //Scrolls the chat container to the bottom.
        function scrollToBottom(smooth = false) {
            if (smooth && "scrollTo" in chat) {
            chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
            } else {
            chat.scrollTop = chat.scrollHeight;
            }
        }

        // append a new line into respond message
        function appendMsg(role, text){
            const line = document.createElement("div");
            // role is "user" or "bot"; we’ll map bot -> assistant for readability
            const cls = (role === "user") ? "user" : "assistant";
            line.className = `msg ${cls}`;
            line.textContent = text;
            messages.appendChild(line);

            // Forces the #response scroll to bottom.
            chat.scrollTop = chat.scrollHeight;
        }
                
        // 1) Default to bottom when the page loads (e.g., if you render history)
        document.addEventListener("DOMContentLoaded", () => scrollToBottom());

        
        // sessionStorage persists for the current browser tab session (clears when tab closes).
        let sessionId = sessionStorage.getItem(KEY);
        // if sessionid = null
        if (!sessionId) {
            // generate a random sessionid and then store it in sessionStorage
            sessionId = (crypto?.randomUUID?.() ?? String(Date.now()));
            sessionStorage.setItem(KEY, sessionId);
        }

      async function send() {
        const text = input.value.trim();
        // exits if text is empty
        if (!text) return;

        appendMsg("user", text);  // right-aligned, no background

        // chat.textContent += (chat.textContent ? "\n" : "") + "YOU: " + text;
        scrollToBottom();           // 2) after user line

        input.value = "";
        input.focus();
        sendBtn.disabled = true;

        try {
          // Calls backend endpoint POST /send
          const res = await fetch("/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // Sends JSON body { session_id, account_number, text }.
            body: JSON.stringify({ session_id: sessionId, 
                                   account_number: account,
                                   text })
          });
          // Waits for response and parses it as JSON into data.
          const data = await res.json();
          
          if (data.awaiting_approval) {
            // chat.textContent += "\nBOT: I need your confirmation to process your request. Please reply 'yes' to agree or 'no' to disagree.\n";
            appendMsg("bot", "I need your confirmation to process your request. Please reply 'yes' to agree or 'no' to disagree.")
          } else {
            // if backend does not need a confirmation, just show the response message out or the text "(no reply)"
            appendMsg("bot", data.reply || "(no reply)");
          }
          scrollToBottom(true);     // 3) after bot line (smooth)
        } catch (err) {
          console.error(err);
        //   chat.textContent += `\n[ERROR] Failed to reach /send\n`;
          appendMsg("bot", "[ERROR] Could not reach /send");
        } finally {
          sendBtn.disabled = false;
        }
      }

      // Clicking the button triggers send()
      sendBtn.onclick = send;
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault(); //stops the textarea from adding a newline when Enter is used to send.
          send(); // Press Enter sends the message.
        }
      });

      // When the page loads, it checks if it has already greeted this tab session.
      // If not, it appends a greeting and sets greeted=1.
      window.addEventListener('DOMContentLoaded', () => {
        if (!sessionStorage.getItem('greeted')) {
          appendMsg('assistant', 'Hello! Welcome to ALLIANCE Bank support. How can I assist you today?');
          sessionStorage.setItem('greeted', '1');
        }
      });
    </script>
  </body>
</html>
